# Council member models. Re-run ./setup.sh after editing.
# PROVIDER is any Hermes provider id (openrouter, custom, ...).

# Each member uses a different model family so the cross-review isn't biased toward one model.

# Set CARTOGRAPHER_PROVIDER=auto to use the local llama.cpp/Ollama model below when reachable,
# falling back to CARTOGRAPHER_MODEL on OpenRouter.
CARTOGRAPHER_PROVIDER=openrouter
CARTOGRAPHER_MODEL=z-ai/glm-5.3-flash
CARTOGRAPHER_LOCAL_BASE_URL=http://127.0.0.1:8080/v1
CARTOGRAPHER_LOCAL_MODEL=qwen3.8-27b

LINKER_PROVIDER=openrouter
LINKER_MODEL=deepseek/deepseek-v4-pro

VERIFIER_PROVIDER=openrouter
VERIFIER_MODEL=openai/gpt-5.6-luna

CHAIR_PROVIDER=openrouter
CHAIR_MODEL=qwen/qwen3.8-max-0902
